[versions]
# AGP 9.4 pairs with Gradle 9.6 and supports compileSdk 37 (Android 17).
# AGP 9 has built-in Kotlin support, so no separate kotlin-android plugin is applied;
# the Compose compiler plugin version selects the Kotlin version.
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 Expressive (Android 16/17 design: button groups, wavy progress, flexible app
# bars, shape-morphing buttons) is stable in 1.5; the BOM above still pins 1.4.0.
material3 = "1.5.0-beta02"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
codeScanner = "16.1.0"
junit = "4.13.2"
# QR code generation (encoder only is used; the ML Kit scanner can only read codes).
zxing = "3.5.3"
orgJson = "20260814"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
play-services-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "codeScanner" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Real org.json implementation for JVM unit tests (android.jar only has stubs).
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
