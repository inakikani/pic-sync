<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pic-sync</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; }
  input, button { font-size: 1.1rem; width: 100%; margin: .5rem 0; }
  button { padding: .8rem; border: 0; border-radius: .5rem; background: #2563eb; color: #fff; }
  button:disabled { background: #94a3b8; }
  ul { list-style: none; padding: 0; font-size: .9rem; }
  li { display: flex; justify-content: space-between; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid #e5e7eb; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
  #summary { font-weight: bold; }
</style>
</head>
<body>
<h1>Upload photos</h1>
<input id="files" type="file" multiple accept="image/*,video/*">
<button id="go" disabled>Upload</button>
<p id="summary"></p>
<ul id="list"></ul>
<script>
const input = document.getElementById('files');
const btn = document.getElementById('go');
const list = document.getElementById('list');
const summary = document.getElementById('summary');

input.addEventListener('change', () => {
  btn.disabled = input.files.length === 0;
  summary.textContent = input.files.length ? `${input.files.length} file(s) selected` : '';
  list.innerHTML = '';
});

function uploadOne(file, statusEl) {
  return new Promise(resolve => {
    const fd = new FormData();
    fd.append('file', file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) statusEl.textContent = Math.round(e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 200) { statusEl.textContent = '✓'; statusEl.className = 'ok'; resolve(true); }
      else {
        let msg = 'error ' + xhr.status;
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        statusEl.textContent = '✗ ' + msg; statusEl.className = 'err'; resolve(false);
      }
    };
    xhr.onerror = () => { statusEl.textContent = '✗ network error'; statusEl.className = 'err'; resolve(false); };
    xhr.send(fd);
  });
}

btn.addEventListener('click', async () => {
  const files = Array.from(input.files);
  btn.disabled = input.disabled = true;
  list.innerHTML = '';
  const rows = files.map(f => {
    const li = document.createElement('li');
    const name = document.createElement('span'); name.textContent = f.name;
    const status = document.createElement('span'); status.textContent = 'waiting';
    li.append(name, status); list.append(li);
    return status;
  });
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    summary.textContent = `Uploading ${i + 1} / ${files.length}…`;
    if (await uploadOne(files[i], rows[i])) ok++;
  }
  const failed = files.length - ok;
  summary.textContent = `Done: ${ok} uploaded` + (failed ? `, ${failed} failed` : '');
  input.value = '';
  input.disabled = false;
});
</script>
</body>
</html>
