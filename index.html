<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pic-sync</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.4rem; }
  input, button { font-size: 1.1rem; width: 100%; margin: .5rem 0; }
  button { padding: .8rem; border: 0; border-radius: .5rem; background: #2563eb; color: #fff; }
  button:disabled { background: #94a3b8; }
  ul { list-style: none; padding: 0; font-size: .9rem; }
  li { display: flex; justify-content: space-between; gap: .5rem; padding: .3rem 0; border-bottom: 1px solid #e5e7eb; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: #16a34a; } .err { color: #dc2626; } .dup { color: #ca8a04; }
  #summary { font-weight: bold; }
  .hint { font-size: .8rem; color: #6b7280; margin: 0; }
</style>
</head>
<body>
<h1>Upload photos</h1>
<!-- Listing HEIC/HEIF explicitly tells iOS the page accepts Apple's formats, so it sends the
     original photos instead of converting each one to JPEG (slow, and not the original file). -->
<input id="files" type="file" multiple accept="image/*,video/*,image/heic,image/heif,.heic,.heif">
<p class="hint">On iPhone, after tapping <b>Add</b>, iOS may take a moment to prepare large selections or photos stored in iCloud.</p>
<button id="go" disabled>Upload</button>
<p id="summary"></p>
<ul id="list"></ul>
<script>
const input = document.getElementById('files');
const btn = document.getElementById('go');
const list = document.getElementById('list');
const summary = document.getElementById('summary');

// Reports what the browser's file picker does to the Mac's log ("page: …" lines),
// so problems that never reach an upload (e.g. iOS handing over no files) can be seen.
function report(event, data = {}) {
  try {
    const body = JSON.stringify(Object.assign({ event }, data));
    if (!(navigator.sendBeacon && navigator.sendBeacon('/api/page-log', new Blob([body], { type: 'application/json' })))) {
      fetch('/api/page-log', { method: 'POST', body, headers: { 'Content-Type': 'application/json' }, keepalive: true }).catch(() => {});
    }
  } catch (e) { /* diagnostics must never break the page */ }
}
report('page opened', { touch: navigator.maxTouchPoints > 0 });

let pickerOpenedAt = 0;   // when the picker was opened (0 = not open)
let gotResult = false;    // change or cancel arrived since then

input.addEventListener('click', () => {
  pickerOpenedAt = Date.now();
  gotResult = false;
  report('picker opened');
});

// When the page gets focus back but the picker hasn't delivered anything yet, the
// phone is usually still preparing the files (iOS converts or downloads them from
// iCloud first). Say so instead of looking frozen, and log it.
window.addEventListener('focus', () => {
  if (!pickerOpenedAt) return;
  setTimeout(() => {
    if (pickerOpenedAt && !gotResult) {
      summary.textContent = 'Waiting for your phone to hand over the selected files…';
      report('picker closed, waiting for files', { seconds: Math.round((Date.now() - pickerOpenedAt) / 1000) });
    }
  }, 1500);
});

input.addEventListener('cancel', () => {
  gotResult = true;
  pickerOpenedAt = 0;
  report('picker cancelled');
});

input.addEventListener('change', () => {
  const files = Array.from(input.files);
  const seconds = pickerOpenedAt ? Math.round((Date.now() - pickerOpenedAt) / 1000) : null;
  gotResult = true;
  pickerOpenedAt = 0;
  btn.disabled = files.length === 0;
  list.innerHTML = '';
  if (files.length === 0) {
    summary.textContent = 'Your phone handed over no files. Try selecting fewer, or (on iPhone) Safari.';
    report('picker returned nothing', { seconds });
    return;
  }
  const types = {};
  let bytes = 0, empty = 0;
  for (const f of files) {
    const t = f.type || '(no type)';
    types[t] = (types[t] || 0) + 1;
    bytes += f.size;
    if (f.size === 0) empty++;
  }
  summary.textContent = `${files.length} file(s) selected` + (empty ? ` (${empty} empty: your phone didn't hand them over completely)` : '');
  report(empty ? 'picker returned files, some empty: error' : 'picker returned files', {
    count: files.length,
    mb: Math.round(bytes / 1e5) / 10,
    empty,
    seconds,
    types: Object.entries(types).map(([t, n]) => `${t}×${n}`).join(', '),
    first: files[0].name,
  });
});

function uploadOne(file, statusEl) {
  return new Promise(resolve => {
    const fd = new FormData();
    // The file's date, sent before the file. The server prefers the capture date stored
    // in the photo/video itself and only uses this for files without one.
    fd.append('mtime', String(file.lastModified));
    fd.append('file', file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) statusEl.textContent = Math.round(e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        let dup = null;
        try { const f = JSON.parse(xhr.responseText).saved[0]; if (f.duplicate) dup = f.name; } catch {}
        if (dup) { statusEl.textContent = '= already on Mac' + (dup !== file.name ? ` as ${dup}` : ''); statusEl.className = 'dup'; resolve('dup'); }
        else { statusEl.textContent = '✓'; statusEl.className = 'ok'; resolve('ok'); }
      }
      else {
        let msg = 'error ' + xhr.status;
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        report('upload error', { name: file.name, type: file.type, mb: Math.round(file.size / 1e5) / 10, status: xhr.status, msg });
        statusEl.textContent = '✗ ' + msg; statusEl.className = 'err'; resolve('err');
      }
    };
    xhr.onerror = () => {
      report('upload error', { name: file.name, type: file.type, mb: Math.round(file.size / 1e5) / 10, msg: 'network error' });
      statusEl.textContent = '✗ network error'; statusEl.className = 'err'; resolve('err');
    };
    xhr.send(fd);
  });
}

btn.addEventListener('click', async () => {
  const files = Array.from(input.files);
  btn.disabled = input.disabled = true;
  list.innerHTML = '';
  const rows = files.map(f => {
    const li = document.createElement('li');
    const name = document.createElement('span'); name.textContent = f.name;
    const status = document.createElement('span'); status.textContent = 'waiting';
    li.append(name, status); list.append(li);
    return status;
  });
  const count = { ok: 0, dup: 0, err: 0 };
  for (let i = 0; i < files.length; i++) {
    summary.textContent = `Uploading ${i + 1} / ${files.length}…`;
    count[await uploadOne(files[i], rows[i])]++;
  }
  summary.textContent = `Done: ${count.ok} uploaded` +
    (count.dup ? `, ${count.dup} already on Mac` : '') +
    (count.err ? `, ${count.err} failed` : '');
  report('upload batch done', count);
  input.value = '';
  input.disabled = false;
});
</script>
</body>
</html>
